name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags-ignore: ['v*']

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -count=1 ./...
      - name: Build
        run: go build -o $env:TEMP\nimbus.exe .

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: staticcheck ./...
      - name: Test (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test -v -count=1 ./...
        env:
          GOOS: linux
      - name: Build GTK
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/nimbus-gtk .
      - name: Build Qt (without shim)
        run: CGO_ENABLED=0 go build -tags qt -ldflags="-s -w" -o /tmp/nimbus-qt . 2>&1 || echo "Qt shim not available, skipping Qt build"

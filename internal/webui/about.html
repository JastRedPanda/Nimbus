<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--fg:#111;--sub:#888}
{{if eq .iconTheme "dark"}}
:root{--bg:#1c1c1e;--fg:#eee;--sub:#888}
{{else if eq .iconTheme "auto"}}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#eee;--sub:#888}}
{{end}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{text-align:center;padding:40px}
.logo{width:96px;height:96px;margin-bottom:16px}
h1{font-size:28px;margin-bottom:8px;font-weight:700}
.sub{font-size:16px;color:var(--sub);margin-bottom:24px}
</style>
</head>
<body>
 <div class="card">
<img src="/logo" alt="Nimbus" class="logo">
<h1>Nimbus</h1>
<div class="sub">Мультиплатформний інформер погоди.</div>
</div>
</body>
</html>

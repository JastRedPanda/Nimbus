<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon" type="image/png">
<title>Nimbus — {{.title}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--fg:#111;--h1:#666;--th:#888;--td-border:#ddd;--th-border:#ccc;--extra:#888}
{{if eq .iconTheme "dark"}}
:root{--bg:#111;--fg:#eee;--h1:#888;--th:#888;--td-border:#222;--th-border:#333;--extra:#888}
{{else if eq .iconTheme "auto"}}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--h1:#888;--th:#888;--td-border:#222;--th-border:#333;--extra:#888}}
{{end}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:20px;max-width:640px;margin:0 auto}
h1{text-align:center;font-size:20px;margin-bottom:16px;color:var(--h1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 6px;color:var(--th);font-size:13px;font-weight:600;border-bottom:1px solid var(--th-border)}
td{padding:10px 6px;border-bottom:1px solid var(--td-border);font-size:14px}
tr:last-child td{border-bottom:none}
td.icon{font-size:24px;text-align:center}
td.temp{text-align:right}
td.extra{text-align:right;color:var(--extra);font-size:12px}
</style>
</head>
<body>
<h1>{{.title}}</h1>
<table>
<thead><tr>
<th>Date</th><th>Condition</th><th>Temp</th><th>Wind</th><th>Precip</th>
</tr></thead>
<tbody>
{{range .rows}}<tr>
<td>{{.Date}}</td>
<td class="icon">{{.Icon}}</td>
<td class="temp">{{.TempMax}} / {{.TempMin}}</td>
<td class="extra">{{.Wind}}</td>
<td class="extra">{{.Precip}}</td>
</tr>{{end}}
</tbody>
</table>
</body>
</html>
